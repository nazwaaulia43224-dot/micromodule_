<html lang="id"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f6ff;--cd:#fff;--tx:#1b2250;--mu:#66709a;--bd:#dfe4f5;--pr:#1f4e79;--ok:#10a36b;--okb:#dcf3e7;--no:#e8453c;--nob:#fde6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--cd:#181c36;--tx:#e8ebff;--mu:#9aa3cc;--bd:#2b3159;--pr:#8fb4ff;--okb:#12382c;--nob:#431f23}}
:root[data-theme="dark"]{--bg:#0f1226;--cd:#181c36;--tx:#e8ebff;--mu:#9aa3cc;--bd:#2b3159;--pr:#8fb4ff;--okb:#12382c;--nob:#431f23}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(135deg,#1f4e79,#2f6fe4 60%,#8b4fd8);color:#fff;padding:18px 16px;text-align:center}
.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;font-size:14px;opacity:.9}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#10a36b,#2f6fe4);transition:width .4s}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--bd);font-size:12px;font-weight:700;margin-right:6px}
.stim{border:2px solid var(--pr);border-radius:12px;padding:10px 12px;margin:10px 0}.stim b{color:var(--pr)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}th{background:var(--pr);color:#fff}th,td{border:1px solid var(--bd);padding:4px 8px;text-align:center}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--pr)}.opt b.l{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bd);text-align:center;line-height:26px;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}.opt.ok b.l{background:var(--ok);color:#fff}.opt.no b.l{background:var(--no);color:#fff}
.opt span i{color:var(--mu)}
.fb{border-radius:12px;padding:12px 14px;margin-top:10px}.fb.ok{background:var(--okb);border-left:6px solid var(--ok)}.fb.no{background:var(--nob);border-left:6px solid var(--no)}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;background:var(--pr);color:var(--bg);cursor:pointer;margin:10px 8px 0 0}
input{font:inherit;padding:6px 10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
.big{font-size:44px;font-weight:800;color:var(--pr);text-align:center;margin:0}
.rv{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style></head><body>
<div class="hero"><h1>⚗️ Soal Interaktif Kesetimbangan Kimia</h1><p>Kesetimbangan Kimia · Kelas XI · 20 soal + stimulus · umpan balik langsung</p></div>

<script>
const Q=[
{lv:"C2",tp:"Reversibel & sistem tertutup",t:"Dalam botol minuman soda yang tertutup rapat berlangsung reaksi CO₂(g) + H₂O(l) ⇌ H₂CO₃(aq). Pernyataan yang tepat tentang reaksi tersebut beserta alasannya adalah ....",
o:["Reaksi hanya berlangsung ke arah H₂CO₃, karena seluruh CO₂ akhirnya habis bereaksi.","Kesetimbangan dapat tercapai, karena reaksi bersifat reversibel dan berlangsung dalam sistem tertutup sehingga tidak ada zat yang keluar.","Kesetimbangan tercapai, karena reaksi maju berhenti setelah H₂CO₃ terbentuk.","Kesetimbangan baru tercapai setelah botol dibuka, karena CO₂ harus bertukar dengan udara luar.","Reaksi tidak mungkin mencapai kesetimbangan, karena H₂CO₃ tidak dapat terurai kembali menjadi CO₂ dan H₂O."],k:1,
f:{0:"Reaksi ini reversibel: H₂CO₃ dapat terurai kembali, sehingga reaksi tidak berjalan satu arah sampai CO₂ habis.",2:"Reaksi maju tidak berhenti. Pada kesetimbangan laju maju sama dengan laju balik (dinamis).",3:"Membuka botol membuat CO₂ keluar, sehingga sistem menjadi terbuka dan kesetimbangan terganggu.",4:"H₂CO₃ dapat terurai kembali menjadi CO₂ dan H₂O; justru itu ciri reaksi reversibel."},
e:"Kesetimbangan kimia hanya dapat tercapai pada reaksi reversibel dalam sistem tertutup, sehingga tidak ada zat yang keluar atau masuk."},
{lv:"C2",tp:"Reversibel vs ireversibel",t:"Reaksi yang tergolong reversibel beserta alasan yang tepat adalah ....",
o:["Pembakaran kertas menjadi abu, karena reaksi tersebut menghasilkan gas CO₂ dan uap air.","Perkaratan besi, karena karat dapat berubah kembali menjadi besi dengan sendirinya pada suhu kamar.","Pembakaran pita magnesium membentuk MgO, karena MgO dapat berubah kembali menjadi Mg dan O₂ tanpa pemanasan.","Reaksi N₂O₄(g) ⇌ 2NO₂(g) dalam wadah tertutup, karena NO₂ yang terbentuk dapat bereaksi kembali menjadi N₂O₄ sehingga reaksi berlangsung ke dua arah.","Pembakaran gas LPG, karena reaksi melepaskan kalor sehingga produk dapat kembali menjadi pereaksi."],k:3,
f:{0:"Pembakaran kertas ireversibel: abu dan gas tidak kembali menjadi kertas. Menghasilkan gas bukan ciri reaksi reversibel.",1:"Karat tidak berubah kembali menjadi besi dengan sendirinya.",2:"MgO tidak kembali menjadi Mg dan O₂ dengan sendirinya; pembakaran Mg ireversibel.",4:"Pembakaran LPG ireversibel. Pelepasan kalor tidak membuat produk kembali menjadi pereaksi."},
e:"Reaksi reversibel berlangsung dua arah: produk dapat bereaksi kembali membentuk pereaksi pada kondisi yang sama, seperti N₂O₄ ⇌ 2NO₂ dalam wadah tertutup. Pembakaran dan perkaratan bersifat ireversibel."},
{lv:"C2",tp:"Rumus Kc",t:"Pada reaksi CaCO₃(s) ⇌ CaO(s) + CO₂(g), rumus tetapan kesetimbangan konsentrasi (Kc) beserta alasan yang tepat adalah ....",
o:["Kc = [CaO][CO₂] / [CaCO₃], karena semua zat dalam persamaan reaksi harus dimasukkan dalam rumus Kc.","Kc = [CaCO₃] / ([CaO][CO₂]), karena Kc adalah perbandingan konsentrasi pereaksi terhadap produk.","Kc = [CO₂], karena konsentrasi zat padat murni dianggap tetap sehingga tidak dimasukkan dalam rumus Kc.","Kc = [CaO] / [CaCO₃], karena gas CO₂ tidak memengaruhi kesetimbangan.","Kc = [CaO][CO₂], karena hanya produk yang dimasukkan dalam rumus Kc."],k:2,
f:{0:"Zat padat murni tidak dituliskan dalam rumus Kc.",1:"Kc adalah produk dibagi pereaksi (bukan sebaliknya), dan zat padat tidak ditulis.",3:"Rumus ini memuat zat padat dan mengabaikan CO₂, padahal hanya CO₂ yang berfase gas.",4:"Zat padat tidak ditulis, sehingga CaO tidak muncul; hasilnya hanya [CO₂]."},
e:"Zat padat murni dan cairan murni berkonsentrasi tetap sehingga tidak dituliskan. Satu-satunya zat berfase gas adalah CO₂, jadi Kc = [CO₂]."},
{lv:"C3",tp:"Menghitung Kc",t:"Pada suhu tertentu, reaksi 2NO(g) + O₂(g) ⇌ 2NO₂(g) mencapai kesetimbangan dengan [NO] = 0,10 M, [O₂] = 0,20 M, dan [NO₂] = 0,40 M. Nilai Kc beserta alasan perhitungannya adalah ....",
o:["20 M⁻¹, karena Kc = [NO₂] / ([NO][O₂]) tanpa memangkatkan koefisien.","80 M⁻¹, karena Kc = [NO₂]² / ([NO]²[O₂]) dengan koefisien sebagai pangkat konsentrasi.","0,0125 M, karena Kc = [NO]²[O₂] / [NO₂]² (pereaksi dibagi produk).","200 M⁻², karena Kc = [NO₂] / ([NO]²[O₂]) dengan koefisien NO₂ tidak dipangkatkan.","400 M⁻², karena Kc = [NO₂]² / ([NO][O₂])²."],k:1,
f:{0:"Koefisien harus menjadi pangkat konsentrasi, jadi [NO₂] dan [NO] berpangkat 2.",2:"Terbalik: Kc = produk dibagi pereaksi.",3:"Koefisien NO₂ (2) juga harus menjadi pangkat.",4:"Pangkat 2 hanya untuk [NO]; [O₂] berkoefisien 1 sehingga tidak dipangkatkan 2."},
e:"Kc = [NO₂]² / ([NO]²[O₂]) = (0,40)² / ((0,10)² × 0,20) = 0,16 / 0,002 = 80 (satuan M²/M³ = M⁻¹)."},
{lv:"C3",tp:"Menghitung Kp",t:"Pada suhu tertentu, reaksi N₂(g) + 3H₂(g) ⇌ 2NH₃(g) mencapai kesetimbangan dengan tekanan parsial N₂ = 1,0 atm, H₂ = 2,0 atm, dan NH₃ = 8,0 atm. Nilai Kp beserta alasan perhitungannya adalah ....",
o:["8 atm⁻², karena Kp = (P NH₃)² / ((P N₂)(P H₂)³).","1 atm⁻³, karena Kp = P NH₃ / ((P N₂)(P H₂)³) dengan tekanan NH₃ tidak dipangkatkan.","32 (tanpa satuan), karena Kp = (P NH₃)² / ((P N₂)(P H₂)) dengan tekanan H₂ tidak dipangkatkan.","0,125 atm², karena Kp = (P N₂)(P H₂)³ / (P NH₃)².","16 atm⁻¹, karena Kp = (P NH₃)² / ((P N₂)(P H₂)²) dengan semua pangkat disamakan 2."],k:0,
f:{1:"Tekanan NH₃ harus dipangkatkan 2 sesuai koefisiennya.",2:"Tekanan H₂ harus dipangkatkan 3 sesuai koefisiennya.",3:"Terbalik: produk berada di pembilang, pereaksi di penyebut.",4:"Pangkat setiap tekanan sama dengan koefisiennya (2, 1, dan 3), tidak boleh disamakan."},
e:"Kp = (P NH₃)² / ((P N₂)(P H₂)³) = 8² / (1 × 2³) = 64 / 8 = 8 atm⁻² (satuan atm² / atm⁴)."},
{lv:"C3",tp:"Qc dan arah reaksi",t:"Pada 450 °C, reaksi H₂(g) + I₂(g) ⇌ 2HI(g) memiliki Kc = 50. Pada suatu saat campuran reaksi mengandung [H₂] = 0,10 M, [I₂] = 0,10 M, dan [HI] = 0,50 M. Kondisi sistem beserta alasannya adalah ....",
o:["Sistem sudah setimbang, karena ketiga zat sama-sama ada dalam campuran.","Reaksi bergeser ke kiri, karena Qc (25) lebih kecil daripada Kc (50) sehingga HI harus terurai.","Reaksi bergeser ke kiri, karena konsentrasi HI paling besar sehingga produk harus berkurang.","Reaksi bergeser ke kanan, karena Qc (25) lebih kecil daripada Kc (50) sehingga HI harus bertambah.","Sistem setimbang, karena Qc = [HI] / ([H₂][I₂]) = 50 sama dengan Kc."],k:3,
f:{0:"Setimbang bila Qc = Kc, bukan sekadar semua zat ada.",1:"Qc < Kc berarti produk masih kurang, jadi bergeser ke kanan, bukan ke kiri.",2:"Arah ditentukan dengan membandingkan Qc dan Kc, bukan konsentrasi mana yang paling besar.",4:"Qc = [HI]² / ([H₂][I₂]) = 25, bukan 50: koefisien HI harus dipangkatkan 2."},
e:"Qc = (0,50)² / (0,10 × 0,10) = 25. Karena Qc < Kc, reaksi bergeser ke kanan (HI bertambah) sampai Qc = Kc."},
{lv:"C4",tp:"Kc dan suhu",t:"Reaksi H₂(g) + I₂(g) ⇌ 2HI(g) dipelajari pada 450 °C dengan tiga komposisi awal berbeda. Konsentrasi saat setimbang tercantum pada tabel. Kesimpulan yang didukung oleh data tersebut beserta alasannya adalah ....",
st:"<table><tr><th>Percobaan</th><th>[H₂] (M)</th><th>[I₂] (M)</th><th>[HI] (M)</th></tr><tr><td>1</td><td>0,010</td><td>0,020</td><td>0,100</td></tr><tr><td>2</td><td>0,020</td><td>0,090</td><td>0,300</td></tr><tr><td>3</td><td>0,040</td><td>0,020</td><td>0,200</td></tr></table>",
o:["Nilai Kc berbeda pada setiap percobaan, karena konsentrasi setimbang tiap zat berbeda.","Nilai Kc bergantung pada konsentrasi awal, karena percobaan dengan [HI] terbesar memberikan Kc terbesar.","Nilai Kc hanya dapat ditentukan dari percobaan 1, karena percobaan 2 dan 3 belum mencapai kesetimbangan.","Nilai Kc ≈ 0,02 pada ketiga percobaan, karena Kc = [H₂][I₂] / [HI]².","Nilai Kc = 50 pada ketiga percobaan, karena Kc hanya bergantung pada suhu, bukan pada komposisi campuran."],k:4,
f:{0:"Konsentrasi tiap zat berbeda, tetapi perbandingannya (Kc) sama. Hitung Kc setiap percobaan.",1:"Kc tidak bergantung pada konsentrasi awal.",2:"Data pada tabel adalah konsentrasi saat setimbang untuk ketiga percobaan.",3:"Rumus Kc terbalik: produk di pembilang, sehingga Kc = 50, bukan 0,02."},
e:"Percobaan 1: 0,100² / (0,010 × 0,020) = 50. Percobaan 2: 0,300² / (0,020 × 0,090) = 50. Percobaan 3: 0,200² / (0,040 × 0,020) = 50. Kc hanya dipengaruhi suhu."},
{lv:"C2",tp:"Katalis",t:"Pada proses kontak, katalis V₂O₅ digunakan dalam reaksi 2SO₂(g) + O₂(g) ⇌ 2SO₃(g). Pernyataan yang tepat tentang pengaruh katalis beserta alasannya adalah ....",
o:["Katalis menggeser kesetimbangan ke kanan, karena katalis hanya menurunkan energi aktivasi reaksi maju.","Katalis menaikkan nilai Kc, karena produk lebih cepat terbentuk.","Katalis menggeser kesetimbangan ke kiri, karena katalis mempercepat reaksi balik.","Katalis mempercepat tercapainya kesetimbangan tanpa menggeser posisi kesetimbangan, karena katalis menurunkan energi aktivasi reaksi maju dan reaksi balik sama besar.","Katalis tidak berpengaruh sama sekali, karena reaksi pada keadaan setimbang sudah berhenti."],k:3,
f:{0:"Katalis menurunkan energi aktivasi reaksi maju dan balik, tidak hanya maju, sehingga tidak menggeser kesetimbangan.",1:"Katalis tidak mengubah Kc; Kc hanya dipengaruhi suhu.",2:"Katalis mempercepat reaksi maju dan balik sama besar, jadi tidak menggeser ke kiri.",4:"Pada kesetimbangan reaksi tidak berhenti (dinamis), dan katalis tetap mempercepat tercapainya kesetimbangan."},
e:"Katalis menurunkan energi aktivasi reaksi maju dan balik sama besar: kesetimbangan lebih cepat tercapai, sedangkan posisi kesetimbangan dan nilai Kc tidak berubah."}];
const L='ABCDE',NO=[1,2,6,7,8,9,10,'C1'];Q.forEach((q,n)=>q.no=NO[n]);
const svgc=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w*1.6}px;font-size:9px;fill:currentColor">${b}</svg>`;
function line(ser,o){const w=o.w||260,h=o.h||175,Lm=38,B=26,T=14,R=8,x0=o.x0||0,y0=o.y0||0,X=t=>Lm+(w-Lm-R)*(t-x0)/(o.xm-x0),Y=v=>h-B-(h-B-T)*(v-y0)/(o.ym-y0);
 let b=`<text x="${w/2}" y="9" text-anchor="middle" font-weight="700">${o.title||''}</text><path d="M${Lm} ${T}V${h-B}H${w-R}" stroke="currentColor" fill="none" opacity=".5"/>`;
 for(let t=x0;t<=o.xm+1e-9;t+=o.xs)b+=`<text x="${X(t)}" y="${h-B+11}" text-anchor="middle">${t}</text>`;
 for(let v=y0;v<=o.ym+1e-9;v+=o.ys)b+=`<text x="${Lm-3}" y="${Y(v)+3}" text-anchor="end">${+v.toFixed(3)}</text><path d="M${Lm} ${Y(v)}H${w-R}" stroke="currentColor" opacity=".1"/>`;
 b+=`<text x="${w/2}" y="${h-2}" text-anchor="middle">${o.xl}</text><text x="8" y="${h/2}" transform="rotate(-90 8 ${h/2})" text-anchor="middle">${o.yl}</text>`;
 ser.forEach(s=>{let d='';for(let i=0;i<=120;i++){const t=x0+(o.xm-x0)*i/120;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(s.f(t)).toFixed(1)}b+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2"/>`});
 (o.vl||[]).forEach(t=>b+=`<path d="M${X(t)} ${T}V${h-B}" stroke="currentColor" stroke-dasharray="3" opacity=".6"/>`);
 return `<div style="flex:1 1 230px">${svgc(w,h,b)}<div style="font-size:12px">${ser.map(s=>`<b style="color:${s.c}">━ ${s.n}</b>`).join(' &nbsp; ')}</div></div>`}
function bars(v,lb,o){const w=190,h=150,Lm=30,B=26,T=14,bw=(w-Lm-6)/v.length;let b=`<text x="${w/2}" y="9" text-anchor="middle" font-weight="700">${o.title||''}</text><path d="M${Lm} ${T}V${h-B}H${w-4}" stroke="currentColor" fill="none" opacity=".5"/>`;
 for(let u=0;u<=o.ym+1e-9;u+=o.ys)b+=`<text x="${Lm-3}" y="${h-B-(h-B-T)*u/o.ym+3}" text-anchor="end">${u.toFixed(1)}</text>`;
 v.forEach((u,i)=>{const y=h-B-(h-B-T)*u/o.ym;b+=`<rect x="${Lm+i*bw+4}" y="${y}" width="${bw-8}" height="${h-B-y}" fill="${o.c[i%o.c.length]}"/><text x="${Lm+i*bw+bw/2}" y="${y-2}" text-anchor="middle">${u.toFixed(2).replace('.',',')}</text><text x="${Lm+i*bw+bw/2}" y="${h-B+11}" text-anchor="middle">${lb[i]}</text>`});return `<div style="flex:1 1 150px">${svgc(w,h,b)}</div>`}
function tubes(a,t){let b='';a.forEach((u,i)=>{const x=10+i*54;b+=`<rect x="${x}" y="8" width="30" height="80" rx="14" fill="none" stroke="currentColor"/><path d="M${x+1} 38H${x+29}V74Q${x+29} 87 ${x+15} 87Q${x+1} 87 ${x+1} 74Z" fill="${u[0]}"/><text x="${x+15}" y="102" text-anchor="middle">${u[1]}</text>`});return `<div style="flex:1 1 200px"><div style="font-weight:700;font-size:13px">${t}</div>${svgc(a.length*54+10,110,b)}</div>`}
const ip=(p,lg)=>t=>{for(let i=1;i<p.length;i++)if(t<=p[i][0]||i==p.length-1){const a=p[i-1],b=p[i],r=(t-a[0])/(b[0]-a[0]);return lg?Math.exp(Math.log(a[1])+(Math.log(b[1])-Math.log(a[1]))*r):a[1]+(b[1]-a[1])*r}};
const C1='#2f6fe4',C2='#e0701f',C3='#2e8b57',C4='#c93a3a',row=h=>`<div style="display:flex;gap:10px;flex-wrap:wrap">${h}</div>`;
const A1=t=>.04+.06*Math.exp(-t/15),B1=t=>.12-.12*Math.exp(-t/15);
const N7=t=>t<20?.04:t<60?.103-.023*Math.exp(-(t-20)/6):.068+.035*Math.exp(-(t-60)/8),M7=t=>t<20?.12:t<60?.193+.047*Math.exp(-(t-20)/6):.262-.069*Math.exp(-(t-60)/8);
const h6=(a)=>ip(a,1),yo={xs:20,ys:.02,ym:.1,w:200,h:160,xm:60,xl:'Waktu (s)',yl:'Konsentrasi (M)'};
const ST={
S1:{h:'STIMULUS 1 | Perubahan Konsentrasi dan Laju Reaksi N₂O₄ ⇌ 2NO₂',u:'3',x:'Gas N₂O₄ (tidak berwarna) sebesar 0,100 M dimasukkan ke dalam wadah tertutup bervolume tetap pada suhu 100 °C. Gas tersebut terurai menjadi gas NO₂ (cokelat) menurut reaksi N₂O₄(g) ⇌ 2NO₂(g). Perubahan konsentrasi serta laju reaksi maju dan balik terhadap waktu ditunjukkan pada gambar berikut.',
 g:()=>row(line([{n:'N₂O₄',c:C1,f:A1},{n:'NO₂',c:C2,f:B1}],{title:'(a) Konsentrasi terhadap waktu',xm:90,xs:20,ym:.14,ys:.02,xl:'Waktu (s)',yl:'Konsentrasi (M)',vl:[60]})+line([{n:'Laju maju',c:C3,f:t=>50*A1(t)},{n:'Laju balik',c:C4,f:t=>139*B1(t)**2}],{title:'(b) Laju reaksi terhadap waktu',xm:90,xs:20,ym:5,ys:1,xl:'Waktu (s)',yl:'Laju (×10⁻³ M/s)',vl:[60]}))},
S2:{h:'STIMULUS 2 | Grafik Konsentrasi Tiga Reaksi',u:'4–5',x:'Tiga reaksi berlangsung dalam wadah tertutup pada suhu tetap, yaitu reaksi I: A → B, reaksi II: C ⇌ D, dan reaksi III: E ⇌ F. Grafik konsentrasi zat terhadap waktu selama 60 detik ditunjukkan pada gambar berikut.',
 g:()=>row(line([{n:'A',c:C1,f:t=>.1*Math.exp(-t/8)},{n:'B',c:C2,f:t=>.1-.1*Math.exp(-t/8)}],{...yo,title:'Reaksi I'})+line([{n:'C',c:C1,f:t=>.04+.06*Math.exp(-t/10)},{n:'D',c:C2,f:t=>.06-.06*Math.exp(-t/10)}],{...yo,title:'Reaksi II'})+line([{n:'E',c:C1,f:t=>.1-.058*t/60},{n:'F',c:C2,f:t=>.058*t/60}],{...yo,title:'Reaksi III'}))},
S3:{h:'STIMULUS 3 | Data Campuran Reaksi CO + H₂O',u:'11',x:'Reaksi CO(g) + H₂O(g) ⇌ CO₂(g) + H₂(g) memiliki Kc = 4,0 pada suhu tertentu. Tiga campuran gas (masing-masing dalam wadah 1 L) disiapkan dengan konsentrasi seperti pada gambar berikut.',
 g:()=>{const lb=['CO','H₂O','CO₂','H₂'],o=t=>({title:'Campuran '+t,ym:1.2,ys:.2,c:[C1,'#6ab4ea',C2,'#f6ad55']});return row(bars([.5,.5,1,1],lb,o('P'))+bars([.2,.5,.6,.5],lb,o('Q'))+bars([.1,.2,.4,.4],lb,o('R')))}},
S4:{h:'STIMULUS 4 | Kesetimbangan pada Proses Kontak',u:'12',x:'Pada proses kontak untuk pembuatan asam sulfat, gas SO₂ dioksidasi menjadi SO₃ dengan katalis V₂O₅ menurut reaksi 2SO₂(g) + O₂(g) ⇌ 2SO₃(g) pada suhu 1000 K. Komposisi campuran gas saat setimbang ditunjukkan pada gambar berikut (R = 0,082 L atm mol⁻¹ K⁻¹).',
 g:()=>bars([.2,.1,.8],['SO₂','O₂','SO₃'],{title:'Tekanan parsial (atm)',ym:1,ys:.2,c:[C1,'#6ab4ea',C2]})},
S5:{h:'STIMULUS 5 | Kesetimbangan Kompleks Kobalt(II)',u:'13–14',x:'Larutan kobalt(II) klorida mengandung kesetimbangan [Co(H₂O)₆]²⁺(aq) + 4Cl⁻(aq) ⇌ [CoCl₄]²⁻(aq) + 6H₂O(l). Ion kompleks [Co(H₂O)₆]²⁺ berwarna merah muda, sedangkan [CoCl₄]²⁻ berwarna biru. Peserta didik mengamati perubahan warna larutan pada beberapa perlakuan: air es (± 0 °C), suhu ruang (± 27 °C), air panas (± 80 °C); serta tabung 4 (tanpa perlakuan), tabung 1 (+ HCl pekat), tabung 2 (+ akuades), dan tabung 3 (+ AgNO₃, terbentuk endapan putih).',
 g:()=>{const P='#f1a7c0',U='#9b6bc9',Bl='#2553c6';return row(tubes([[P,'Air es'],[U,'Ruang'],[Bl,'Panas']],'Pengaruh suhu')+tubes([[U,'Tabung 4'],[Bl,'Tabung 1'],[P,'Tabung 2'],[P,'Tabung 3']],'Pengaruh penambahan zat'))}},
S6:{h:'STIMULUS 6 | Proses Haber–Bosch',u:'15–16',x:'Industri memproduksi amonia melalui proses Haber–Bosch menurut reaksi N₂(g) + 3H₂(g) ⇌ 2NH₃(g) dengan ΔH = −92 kJ dan katalis besi. Grafik berikut menunjukkan persentase NH₃ pada keadaan setimbang pada berbagai suhu dan tekanan.',
 g:()=>row(line([{n:'100 atm',c:C1,f:h6([[300,52],[400,25],[500,10.5],[600,4.5]])},{n:'200 atm',c:C3,f:h6([[300,71],[400,39],[500,18],[600,8]])},{n:'300 atm',c:C2,f:h6([[300,79],[400,47],[500,26],[600,13]])}],{w:380,h:200,x0:300,xm:600,xs:50,ym:80,ys:10,title:'N₂ + 3H₂ ⇌ 2NH₃  ΔH = −92 kJ',xl:'Suhu (°C)',yl:'NH₃ saat setimbang (%)'}))},
S7:{h:'STIMULUS 7 | Simulasi EquiChem: Gangguan pada Kesetimbangan N₂O₄ ⇌ 2NO₂',u:'17–18',x:'Dalam simulasi interaktif EquiChem, peserta didik mengamati reaksi N₂O₄(g) (tidak berwarna) ⇌ 2NO₂(g) (cokelat) dalam silinder berpiston. Reaksi ke arah NO₂ bersifat endoterm (ΔH > 0). Mula-mula sistem setimbang dengan Kc = 0,36 pada 100 °C. Pada detik ke-20 volume sistem diperkecil menjadi setengahnya pada suhu tetap, kemudian pada detik ke-60 suhu sistem dinaikkan. Hasil simulasi ditunjukkan pada grafik berikut (garis putus-putus: t = 20 s dan t = 60 s).',
 g:()=>row(line([{n:'N₂O₄',c:C1,f:N7},{n:'NO₂',c:C2,f:M7}],{w:400,h:200,xm:100,xs:20,ym:.3,ys:.05,vl:[20,60],title:'N₂O₄ ⇌ 2NO₂ (simulasi EquiChem)',xl:'Waktu (s)',yl:'Konsentrasi (M)'}))},
S8:{h:'STIMULUS 8 | Pengasaman Laut',u:'19',x:'Laut menyerap sekitar seperempat CO₂ yang dilepaskan ke atmosfer. CO₂ yang larut terlibat dalam rangkaian kesetimbangan pada gambar (a), sedangkan tren CO₂ atmosfer dan pH permukaan laut (ilustrasi) ditunjukkan pada gambar (b). Karang dan kerang membentuk cangkang dan kerangka dari CaCO₃.',
 g:()=>`<div style="font-size:14px;line-height:1.9"><b>(a)</b> CO₂(g) ⇌ CO₂(aq)<br>CO₂(aq) + H₂O(l) ⇌ H₂CO₃(aq)<br>H₂CO₃(aq) ⇌ H⁺(aq) + HCO₃⁻(aq)<br>HCO₃⁻(aq) ⇌ H⁺(aq) + CO₃²⁻(aq)<br>CaCO₃(s) ⇌ Ca²⁺(aq) + CO₃²⁻(aq) <i>(cangkang dan kerangka karang)</i></div><b>(b)</b>`+row(line([{n:'CO₂ atmosfer',c:C2,f:ip([[1960,317],[1970,326],[1980,339],[1990,354],[2000,369],[2010,390],[2020,414]])}],{x0:1960,xm:2020,xs:20,y0:300,ym:420,ys:40,xl:'Tahun',yl:'CO₂ (ppm)'})+line([{n:'pH laut',c:C1,f:ip([[1960,8.11],[1970,8.1],[1980,8.09],[1990,8.075],[2000,8.06],[2010,8.05],[2020,8.04]])}],{x0:1960,xm:2020,xs:20,y0:8.03,ym:8.12,ys:.03,xl:'Tahun',yl:'pH permukaan laut'}))},
S9:{h:'STIMULUS 9 | Kesetimbangan dalam Darah',u:'20',x:'Rafi berlari cepat selama 10 menit. Selama berlari, tubuhnya menghasilkan lebih banyak CO₂ dan laju pernapasannya meningkat. Di dalam darah terdapat sistem kesetimbangan seperti pada gambar berikut.',
 g:()=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="padding:8px 12px;border:2px solid #e0a040;border-radius:10px;background:#e0a04022;font-size:13px">Paru-paru<br>(CO₂ dihembuskan)</div><b>⇄</b><div style="padding:8px 12px;border:2px solid #c93a3a;border-radius:10px;background:#c93a3a18;font-size:14px"><b>Darah</b><br>CO₂(g) + H₂O(l) ⇌ H₂CO₃(aq) ⇌ H⁺(aq) + HCO₃⁻(aq)<br><i style="font-size:12px">pH darah normal: 7,35 – 7,45</i></div></div>`}};
const X=(no,lv,tp,st,t,s,v,r,o,k)=>({no,lv,tp,st,t,s,v,r,o,k});
Q.push(
X(3,'C4','Laju & kesetimbangan dinamis','S1','Perhatikan pernyataan berikut berdasarkan grafik pada stimulus!',['Keadaan setimbang mulai tercapai pada t = 60 s.','Setelah t = 60 s, reaksi maju dan reaksi balik sama-sama berhenti.','Pada t = 60 s, laju reaksi maju sama dengan laju reaksi balik.','Sebelum t = 60 s, laju reaksi maju lebih besar daripada laju reaksi balik.','Pada keadaan setimbang, konsentrasi N₂O₄ sama dengan konsentrasi NO₂.'],'10110',['Mulai t = 60 s konsentrasi konstan dan kedua kurva laju bertemu.','Pada kesetimbangan dinamis reaksi tidak berhenti; hanya lajunya yang sama.','Kedua kurva laju bertemu pada keadaan setimbang.','N₂O₄ terus berkurang sebelum setimbang, berarti laju maju > laju balik.','Konsentrasi saat setimbang tidak harus sama: N₂O₄ = 0,040 M dan NO₂ = 0,120 M.'],['1 dan 3','2 dan 4','1, 3, dan 4','1, 3, 4, dan 5','2, 3, dan 5'],2),
X(4,'C4','Reversibel, ireversibel, setimbang','S2','Perhatikan pernyataan berikut tentang ketiga reaksi pada stimulus!',['Reaksi I merupakan reaksi ireversibel karena pereaksi A habis bereaksi.','Reaksi II merupakan reaksi reversibel yang telah mencapai keadaan setimbang dinamis.','Reaksi III telah mencapai kesetimbangan karena pereaksi dan produk ada bersamaan.','Reaksi I telah mencapai kesetimbangan karena konsentrasi B tidak berubah setelah detik ke-30.','Ketiga reaksi pasti reversibel karena ketiganya menghasilkan produk.'],'11000',['A habis sehingga reaksi berlangsung satu arah (ireversibel).','C dan D konstan sejak ± 40 s dengan kedua zat tetap ada: reversibel dan setimbang dinamis.','Konsentrasi masih berubah sampai 60 s sehingga belum setimbang.','A habis, reaksi ireversibel; kesetimbangan memerlukan pereaksi dan produk yang konstan bersamaan.','Terbentuknya produk tidak menunjukkan reaksi reversibel.'],['1 dan 2','1 dan 3','2, 3, dan 4','1, 2, dan 5','3, 4, dan 5'],0),
X(5,'C4','Mengevaluasi kesimpulan','S2','Seorang peserta didik menyimpulkan bahwa reaksi II telah berhenti karena grafik konsentrasinya mendatar setelah detik ke-40. Perhatikan pernyataan berikut untuk mengevaluasi kesimpulan tersebut!',['Kesimpulan tersebut keliru karena pada reaksi II reaksi maju dan reaksi balik masih berlangsung dengan laju yang sama.','Konsentrasi C dan D yang konstan dengan kedua zat tetap ada merupakan bukti bahwa reaksi II setimbang.','Jika wadah reaksi II tetap tertutup dan suhu tetap, konsentrasi C dan D tidak berubah walaupun diamati lebih lama.','Jika wadah reaksi II dibuka dan sebagian D keluar, kesetimbangan tetap terjaga.','Grafik yang mendatar menunjukkan bahwa laju reaksi maju dan laju reaksi balik sama dengan nol.'],'11100',['Grafik mendatar berarti konsentrasi konstan, bukan reaksi berhenti: laju maju = laju balik.','Pereaksi dan produk sama-sama ada dengan konsentrasi konstan: bukti setimbang.','Pada sistem tertutup bersuhu tetap, keadaan setimbang bertahan.','Jika wadah dibuka, zat keluar sehingga kesetimbangan terganggu.','Laju maju dan balik sama besar tetapi tidak nol.'],['1 dan 2','1, 2, dan 4','2, 3, dan 5','1, 3, 4, dan 5','1, 2, dan 3'],4),
X(11,'C4','Qc dan arah reaksi','S3','Perhatikan pernyataan berikut berdasarkan data pada stimulus!',['Campuran P berada dalam keadaan setimbang karena Qc sama dengan Kc.','Campuran Q belum setimbang dan reaksi bergeser ke arah produk karena Qc lebih kecil daripada Kc.','Campuran R bergeser ke arah produk karena Qc (8,0) lebih besar daripada Kc.','Pada campuran R, konsentrasi CO dan H₂O akan bertambah sampai Qc turun menjadi 4,0.','Nilai Qc campuran Q akan naik mendekati Kc seiring berlangsungnya reaksi.'],'11011',['Qc = (1,0 × 1,0) / (0,50 × 0,50) = 4,0 = Kc.','Qc = (0,60 × 0,50) / (0,20 × 0,50) = 3,0 < Kc = 4,0, sehingga ke arah produk.','Qc = 8,0 > Kc: bergeser ke pereaksi, bukan ke produk.','Bergeser ke pereaksi, sehingga CO dan H₂O bertambah sampai Qc = 4,0.','Qc naik dari 3,0 menuju 4,0.'],['1, 2, dan 3','1, 2, 4, dan 5','2, 3, dan 4','1, 3, dan 5','1, 2, 3, dan 4'],1),
X(12,'C4','Kp, Kc, dan Qp','S4','Perhatikan pernyataan berikut!',['Perubahan jumlah mol gas (Δn) untuk reaksi tersebut adalah −1.','Nilai Kp reaksi tersebut adalah 160 atm⁻¹.','Nilai Kc sama dengan nilai Kp karena reaksi berlangsung pada suhu yang sama.','Nilai Kc lebih kecil daripada nilai Kp.','Jika tekanan parsial SO₃ dijadikan 1,0 atm dengan tekanan parsial SO₂ dan O₂ tetap, Qp = 250 sehingga reaksi bergeser ke arah SO₂ dan O₂.'],'11001',['Δn = 2 − 3 = −1.','Kp = (0,80)² / ((0,20)² × 0,10) = 0,64 / 0,004 = 160 atm⁻¹.','Kp = Kc(RT)^Δn, sehingga Kc ≠ Kp.','Kc = Kp × RT = 160 × 0,082 × 1000 = 13.120, lebih besar daripada Kp.','Qp = (1,0)² / ((0,20)² × 0,10) = 250 > Kp (160): bergeser ke kiri (SO₂ dan O₂).'],['1 dan 5','1, 2, 3, dan 4','2, 4, dan 5','1, 2, dan 5','3, 4, dan 5'],3),
X(13,'C4','Suhu & Kc (kompleks kobalt)','S5','Perhatikan pernyataan berikut berdasarkan pengaruh suhu pada stimulus!',['Reaksi ke arah pembentukan [CoCl₄]²⁻ bersifat endoterm.','Pemanasan menggeser kesetimbangan ke kanan sehingga larutan berwarna biru.','Pendinginan menggeser kesetimbangan ke kanan sehingga larutan menjadi lebih biru.','Nilai Kc pada suhu rendah lebih besar daripada pada suhu tinggi.','Nilai Kc dalam air panas lebih besar daripada dalam air es.'],'11001',['Pemanasan memberi warna biru (ke kanan): arah endoterm.','Kenaikan suhu menggeser ke arah endoterm (kanan), larutan biru.','Pendinginan menggeser ke kiri sehingga larutan merah muda.','Pada reaksi endoterm, Kc naik jika suhu naik, bukan turun.','Reaksi endoterm: Kc di air panas lebih besar daripada di air es.'],['1 dan 2','2 dan 3','1, 2, dan 5','2, 4, dan 5','1, 3, dan 4'],2),
X(14,'C4','Konsentrasi & Kc (kompleks kobalt)','S5','Perhatikan pernyataan berikut berdasarkan pengaruh penambahan zat pada stimulus!',['Penambahan HCl pekat menambah Cl⁻ sehingga kesetimbangan bergeser ke kanan.','Penambahan akuades menggeser kesetimbangan ke arah [Co(H₂O)₆]²⁺ (kiri).','Ag⁺ mengikat Cl⁻ membentuk endapan AgCl sehingga [Cl⁻] berkurang dan kesetimbangan bergeser ke kiri.','Perubahan warna pada tabung 1 membuktikan bahwa nilai Kc bertambah besar.','Tabung 1 dan tabung 3 menunjukkan arah pergeseran yang berlawanan karena [Cl⁻] pada tabung 1 naik dan pada tabung 3 turun.'],'11101',['Cl⁻ bertambah: bergeser ke kanan (biru).','Pengenceran menggeser ke kiri (merah muda).','Cl⁻ diendapkan sebagai AgCl, [Cl⁻] turun, bergeser ke kiri (merah muda).','Perubahan konsentrasi tidak mengubah Kc; Kc hanya bergantung pada suhu.','Tabung 1 (Cl⁻ naik, biru) dan tabung 3 (Cl⁻ turun, merah muda) bergeser berlawanan.'],['1, 2, 3, dan 5','1, 2, dan 4','2, 3, dan 4','1, 3, 4, dan 5','2 dan 5'],0),
X(15,'C4','Haber: suhu, tekanan, katalis','S6','Perhatikan pernyataan berikut berdasarkan grafik pada stimulus!',['Reaksi pembentukan NH₃ bersifat eksoterm.','Pada tekanan tetap, kenaikan suhu menurunkan persentase NH₃ pada keadaan setimbang.','Pada suhu tetap, kenaikan tekanan meningkatkan persentase NH₃ karena kesetimbangan bergeser ke arah jumlah mol gas yang lebih sedikit.','Persentase NH₃ pada 500 °C dan 300 atm lebih besar daripada pada 400 °C dan 200 atm.','Penambahan katalis besi meningkatkan persentase NH₃ pada keadaan setimbang.'],'11100',['ΔH negatif: reaksi eksoterm.','Kenaikan suhu menggeser ke kiri sehingga persentase NH₃ turun.','Ruas kiri 4 mol gas, ruas kanan 2 mol gas: tekanan tinggi menggeser ke kanan.','500 °C/300 atm ± 26% lebih kecil daripada 400 °C/200 atm ± 39%.','Katalis tidak menggeser kesetimbangan.'],['1 dan 3','2, 4, dan 5','1, 2, dan 5','3, 4, dan 5','1, 2, dan 3'],4),
X(16,'C4','Pemilihan kondisi industri','S6','Perhatikan pernyataan berikut tentang pemilihan kondisi proses Haber–Bosch berdasarkan stimulus!',['Pada tekanan 200 atm, persentase NH₃ pada 500 °C lebih besar daripada pada 400 °C.','Suhu industri sekitar 400–500 °C dipilih sebagai kompromi: suhu lebih rendah menaikkan hasil kesetimbangan tetapi memperlambat laju reaksi.','Katalis besi digunakan agar kesetimbangan lebih cepat tercapai tanpa mengubah nilai Kc.','Tekanan sebaiknya dinaikkan setinggi mungkin karena biaya dan keselamatan peralatan tidak perlu dipertimbangkan.','Pengambilan NH₃ yang terbentuk melalui pendinginan menggeser kesetimbangan ke kanan sehingga produksi dapat terus berlanjut.'],'01101',['Pada 200 atm, 400 °C (± 39%) lebih besar daripada 500 °C (± 18%).','Suhu rendah menguntungkan hasil tetapi lajunya kecil, sehingga dipakai suhu kompromi.','Katalis mempercepat tercapainya kesetimbangan tanpa mengubah Kc.','Tekanan tinggi memerlukan biaya dan faktor keselamatan.','Pengeluaran NH₃ mengurangi produk sehingga bergeser ke kanan.'],['1, 2, dan 3','2, 3, dan 5','1 dan 4','2, 4, dan 5','3 dan 5'],1),
X(17,'C4','Volume & suhu (simulasi)','S7','Perhatikan pernyataan berikut tentang arah pergeseran kesetimbangan berdasarkan grafik pada stimulus!',['Pada t = 20 s, konsentrasi NO₂ turun seketika karena volume sistem diperkecil.','Setelah t = 20 s, kesetimbangan bergeser ke kanan (arah NO₂) karena tekanan meningkat.','Pengurangan volume menggeser kesetimbangan ke arah yang jumlah mol gasnya lebih sedikit, yaitu ke arah N₂O₄.','Pada t = 60 s, kenaikan suhu menggeser kesetimbangan ke kanan karena reaksi ke arah NO₂ menyerap kalor.','Kenaikan suhu pada t = 60 s tidak mengubah nilai Kc.'],'00110',['Saat volume diperkecil, semua konsentrasi naik seketika.','Pergeseran ke sisi mol gas lebih sedikit (N₂O₄): [NO₂] turun.','N₂O₄ (1 mol) < 2NO₂ (2 mol): bergeser ke N₂O₄.','Kenaikan suhu menggeser ke arah endoterm (kanan): [NO₂] naik.','Perubahan suhu mengubah nilai Kc.'],['1 dan 2','1, 3, dan 4','3 dan 4','2, 3, dan 5','1, 4, dan 5'],2),
X(18,'C4','Qc & Kc setelah perubahan volume','S7','Perhatikan pernyataan berikut tentang analisis data pada detik ke-20 dan sesudahnya!',['Sesaat setelah volume diperkecil pada t = 20 s, nilai Qc = 0,72.','Karena Qc lebih besar daripada Kc, reaksi berlangsung ke arah N₂O₄ (reaksi balik).','Pada kesetimbangan baru setelah volume diperkecil, nilai Kc menjadi lebih besar karena tekanan naik.','Warna campuran pada kesetimbangan baru (t = 40 s) lebih pudar daripada sesaat setelah penekanan, tetapi lebih gelap daripada sebelum penekanan.','Perubahan volume tidak mengubah nilai Kc; hanya perubahan suhu yang mengubah nilai Kc.'],'11011',['[NO₂] = 0,24 M, [N₂O₄] = 0,08 M: Qc = (0,24)² / 0,08 = 0,72.','Qc (0,72) > Kc (0,36): bergeser ke kiri.','Kc hanya dipengaruhi suhu, tetap 0,36.','[NO₂] turun dari 0,24 M ke ± 0,19 M, tetapi masih > 0,12 M sebelum penekanan.','Kc hanya berubah oleh suhu.'],['1 dan 2','1, 2, 3, dan 4','2, 3, dan 5','1, 2, 4, dan 5','2, 4, dan 5'],3),
X(19,'C4','Pengasaman laut','S8','Perhatikan pernyataan berikut tentang pengasaman laut berdasarkan stimulus!',['Kenaikan CO₂ di atmosfer menggeser kesetimbangan CO₂(g) ⇌ CO₂(aq) ke kanan sehingga CO₂ terlarut bertambah.','Bertambahnya ion H⁺ dari penguraian H₂CO₃ menyebabkan pH air laut naik.','Ion H⁺ berlebih bereaksi dengan CO₃²⁻ membentuk HCO₃⁻, sehingga [CO₃²⁻] di laut berkurang.','Berkurangnya [CO₃²⁻] menggeser kesetimbangan CaCO₃(s) ⇌ Ca²⁺ + CO₃²⁻ ke kiri sehingga cangkang makin mudah terbentuk.','Upaya menurunkan emisi CO₂ membantu menahan penurunan pH laut karena jumlah CO₂ yang larut berkurang.'],'10101',['CO₂ atmosfer naik menggeser CO₂(g) ⇌ CO₂(aq) ke kanan.','H⁺ bertambah menyebabkan pH turun, bukan naik.','H⁺ bereaksi dengan CO₃²⁻ sehingga [CO₃²⁻] turun.','[CO₃²⁻] turun menggeser ke kanan: CaCO₃ cenderung larut, cangkang sulit terbentuk.','Emisi CO₂ lebih rendah berarti CO₂ terlarut berkurang dan penurunan pH melambat.'],['1, 3, dan 5','1, 2, dan 3','2, 4, dan 5','3 dan 4','1, 2, 4, dan 5'],0),
X(20,'C4','Kesetimbangan dalam darah','S9','Perhatikan pernyataan berikut tentang sistem kesetimbangan dalam darah pada stimulus!',['Peningkatan produksi CO₂ saat berlari menggeser kesetimbangan ke kanan sehingga [H⁺] bertambah.','Pernapasan yang lebih cepat membuang CO₂ sehingga kesetimbangan bergeser ke kiri dan [H⁺] berkurang.','Pembuangan CO₂ melalui paru-paru menaikkan nilai Kc sistem tersebut.','Respons pernapasan tersebut membantu menjaga pH darah tetap dalam rentang yang sempit.','Napas yang terlalu cepat dan berlebihan (hiperventilasi) justru menurunkan pH darah.'],'11010',['Penambahan CO₂ menggeser ke kanan dan menambah H⁺.','Pembuangan CO₂ menggeser ke kiri sehingga H⁺ berkurang.','Kc hanya dipengaruhi suhu.','Mekanisme ini membantu menjaga pH darah tetap stabil.','Hiperventilasi membuang terlalu banyak CO₂: [H⁺] turun dan pH darah naik, bukan turun.'],['1 dan 2','2, 3, dan 4','1, 3, dan 5','3 dan 5','1, 2, dan 4'],4));
Q.sort((a,b)=>(a.no=='C1'?99:a.no)-(b.no=='C1'?99:b.no));
let i=0,ans=[],name='',kls='';const $=s=>document.querySelector(s),app=$('#app'),lab=q=>q.no=='C1'?'C1 (cadangan)':q.no;
function fmt(s){const p=s.split(', karena ');return p.length>1?`<b>${p[0]}</b>, <i>karena ${p.slice(1).join(', karena ')}</i>`:s}
function stim(q){if(!q.st)return'';const s=ST[q.st];if(!s)return`<div class="stim"><b>Data percobaan</b>${q.st}</div>`;return`<div class="stim"><b>${s.h}</b><p style="margin:6px 0">${s.x}</p>${s.g()}<p style="margin:6px 0 0;color:var(--pr)"><i>Gunakan stimulus ini untuk soal nomor ${s.u}.</i></p></div>`}
function start(){i=0;ans=[];show()}
function show(){const q=Q[i];app.innerHTML=`<div class="card"><div>Soal ${lab(q)} · ${i+1} dari ${Q.length}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><span class="chip">${q.s?'PG kompleks':'PG beralasan'}</span><span class="chip">${q.lv}</span><span class="chip">${q.tp}</span>${stim(q)}<p style="margin-top:10px">${q.t}</p>${q.s?q.s.map((x,n)=>`<div style="margin:2px 0 2px 4px">${n+1}) ${x}</div>`).join('')+'<p>Pernyataan di atas yang benar ditunjukkan oleh nomor ....</p>':''}<div id="ops">${q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})"><b class="l">${L[j]}</b><span>${q.s?o:fmt(o)}</span></button>`).join('')}</div><div id="fb"></div></div>`}
function pick(j){const q=Q[i],ok=j==q.k;ans[i]=j;
 document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n==q.k)b.classList.add('ok');else if(n==j)b.classList.add('no')});
 let msg='',ex='';
 if(q.s){const ch=(q.o[j].match(/\d/g)||[]).map(Number),wr=ch.filter(n=>q.v[n-1]!='1'),ms=[1,2,3,4,5].filter(n=>q.v[n-1]=='1'&&!ch.includes(n));
  if(!ok)msg=`<p style="margin:6px 0 0">${wr.length?'Pernyataan '+wr.join(', ')+' yang kamu pilih ternyata salah. ':''}${ms.length?'Pernyataan '+ms.join(', ')+' sebenarnya benar tetapi tidak kamu pilih.':''}</p>`;
  ex=q.s.map((x,n)=>`<div style="margin-top:4px">${q.v[n]=='1'?'✅':'❌'} <b>${n+1})</b> ${q.v[n]=='1'?'Benar':'Salah'}: ${q.r[n]}</div>`).join('')}
 else{if(!ok)msg=`<p style="margin:6px 0 0">${q.f[j]}</p>`;ex=q.e}
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Tepat!':'❌ Belum tepat.'}</b>${msg}${ok?'':`<p style="margin:6px 0 0">Jawaban yang tepat: <b>${L[q.k]}</b>.</p>`}<p style="margin:8px 0 0"><b>Pembahasan:</b></p>${q.s?'':'<span>'}${ex}${q.s?'':'</span>'}</div><button class="b" onclick="nx()">${i==Q.length-1?'Lihat hasil 🏁':'Soal berikutnya ▶'}</button>`}
function nx(){i++;i<Q.length?show():fin()}
function fin(){const s=ans.filter((a,n)=>a==Q[n].k).length,pc=Math.round(s/Q.length*100);
 const msg=pc>=80?'Sangat baik! Pemahamanmu tentang kesetimbangan kimia sudah kuat.':pc>=60?'Cukup baik. Ulangi materi pada soal yang masih salah.':'Perlu belajar lagi. Pelajari kembali konsep dan pembahasan pada soal yang salah.';
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">Hasil${name?' – '+name:''}${kls?' ('+kls+')':''}</h2><p class="big">${pc}</p><p style="text-align:center;margin:0">${s} dari ${Q.length} soal benar</p><div class="bar"><i style="width:${pc}%"></i></div><p>${msg}</p>${Q.map((q,n)=>{const ok=ans[n]==q.k;return`<div class="rv"><span>${ok?'✅':'❌'}</span><span><b>Soal ${lab(q)}</b> · ${q.tp}${ok?'':` · jawabanmu ${L[ans[n]]}, kunci ${L[q.k]}`}</span></div>`}).join('')}<button class="b" onclick="start()">↺ Ulangi</button></div>`}
start();
</script></body></html>
